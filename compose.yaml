services:
  postgres:
    image: postgres
    container_name: alfahack-postgres
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432/tcp
volumes:
  db-data:
