services:
  postgres:
    image: postgres
    container_name: alfahack-postgres
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432/tcp"
  python-api:
    build: python-api
    container_name: alfahack-python-api
  node-api:
    build: node-api
    container_name: alfahack-node-api
    ports:
      - "127.0.0.1:${PORT}:${PORT}/tcp"
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    depends_on:
      - postgres
      - python-api
volumes:
  db-data:
