services:
  postgres:
    image: postgres:18-alpine
    container_name: alfahack-postgres
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  python-api:
    build: ./python-api
    container_name: alfahack-python-api
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:?OLLAMA_CLOUD_API_KEY is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      MODEL_PATH: /app/classification.cbm
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
    # Порт наружу не публикуется: сервис доступен только внутри Docker-сети.
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  node-api:
    build: ./node-api
    container_name: alfahack-node-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}/tcp"
    environment:
      PORT: ${PORT:-3000}
      # Собираем URL здесь: compose не раскрывает ${...} внутри значений .env.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres
      PYTHON_API_URL: http://python-api:8000
      PYTHON_API_TIMEOUT_MS: ${PYTHON_API_TIMEOUT_MS:-45000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db-data:
